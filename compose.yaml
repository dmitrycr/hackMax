name: hackmax

x-backend: &backend
  build:
    context: .
    dockerfile: services/backend/Dockerfile
  environment: &backend-env
    DATABASE_URL: postgres://${POSTGRES_USER:-hackmax}:${POSTGRES_PASSWORD:?Run make setup}@postgres:5432/${POSTGRES_DB:-hackmax}?sslmode=disable
    PROCESSOR_URL: http://document-processor:8000
    PROCESSOR_TOKEN: ${PROCESSOR_TOKEN:?Run make setup}
    HTTP_ADDR: :8080
    STORAGE_DIR: /data/files
  networks: [internal]

services:
  bot:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    profiles: [bot]
    command: [/app/bot]
    environment:
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_INSECURE_SKIP_VERIFY: ${MAX_INSECURE_SKIP_VERIFY:-false}
    networks: [max-egress]
    restart: 'no'

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hackmax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup}
      POSTGRES_DB: ${POSTGRES_DB:-hackmax}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [/app/migrate]
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'

  api:
    <<: *backend
    command: [/app/api]
    volumes: [documents:/data/files]
    depends_on:
      migrate: {condition: service_completed_successfully}
      document-processor: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/healthcheck]
      interval: 10s
      timeout: 6s
      retries: 5
    restart: unless-stopped

  worker:
    <<: *backend
    command: [/app/worker]
    environment:
      <<: *backend-env
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-180s}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-8000}
    networks: [internal, llm-egress]
    volumes: [documents:/data/files]
    depends_on:
      migrate: {condition: service_completed_successfully}
      document-processor: {condition: service_healthy}
    restart: unless-stopped

  document-processor:
    build:
      context: .
      dockerfile: services/document-processor/Dockerfile
    environment:
      PROCESSOR_TOKEN: ${PROCESSOR_TOKEN:?Run make setup}
    networks: [internal]
    read_only: true
    tmpfs: ['/tmp:size=256m,uid=10001,gid=10001']
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      GATEWAY_ADDRESS: ${GATEWAY_ADDRESS:-:80}
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:80'
      - '127.0.0.1:${HTTPS_PORT:-8443}:443'
    volumes: [caddy-data:/data, caddy-config:/config]
    networks: [internal, public]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

networks:
  internal:
    internal: true
  public:
  llm-egress:
  max-egress:

volumes:
  postgres-data:
  documents:
  caddy-data:
  caddy-config:
