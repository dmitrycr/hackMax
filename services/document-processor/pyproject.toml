[project]
name = "hackmax-document-processor"
version = "0.1.0"
description = "Internal document extraction and OCR boundary for HackMax"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1",
  "python-docx>=1.2,<2",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4.30,<6",
  "pytesseract>=0.3.13,<1",
  "pillow>=11.3,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

